[package]
name = "itonami-series-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
[lib]
name = "itonami_series_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
itonami-series-build = { git = "https://github.com/cloud-itonami/itonami-lib", rev = "eb5fbdffdd2cb4a1509a893bb167191339547254" }
[dependencies]
# tauri must equal the pin in itonami-series-host: generate_context!() expands here.
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = "=3.0.0-alpha.6"
itonami-series-host = { git = "https://github.com/cloud-itonami/itonami-lib", rev = "eb5fbdffdd2cb4a1509a893bb167191339547254" }
[features]
custom-protocol = ["tauri/custom-protocol"]
[profile.dev]
debug = 0
strip = "symbols"
